
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS Simulator App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Practo-Background-Sync-Notes
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: Practo-Background-Sync-Notes
        run: |
          xcodebuild \
            -project PractoBackgroundSyncNotes.xcodeproj \
            -scheme PractoBackgroundSyncNotes \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

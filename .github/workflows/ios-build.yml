
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iPhone IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Locate project
        run: find . -name project.yml -print

      - name: Generate Xcode project
        working-directory: Practo-Background-Sync-Notes
        run: xcodegen generate

      - name: Build for iPhone
        working-directory: Practo-Background-Sync-Notes
        run: |
          xcodebuild \
            -project PractoBackgroundSyncNotes.xcodeproj \
            -scheme PractoBackgroundSyncNotes \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: Practo-Background-Sync-Notes
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/PractoBackgroundSyncNotes.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iPhone app build not found: $APP_PATH"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/PractoBackgroundSyncNotes.app

          cd build
          zip -r PractoBackgroundSyncNotes-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PractoBackgroundSyncNotes-unsigned-IPA
          path: Practo-Background-Sync-Notes/build/PractoBackgroundSyncNotes-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
